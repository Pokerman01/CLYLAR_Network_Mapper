{# Switch for the Discovery-only mDNS / SSDP lookup, with an (i) hover card like the other rows. Needs `prefix` ('ns' / 'rescan'). #}
<div class="adv-switch scan-adv-mc">
    <div class="adv-switch-text">
        <div class="d-flex align-items-center gap-1">
            <label class="adv-label" for="{{ prefix }}_mc_input">{{ t('tasks.adv.mc') }}</label>
            <span class="scan-adv-info-btn" role="button" tabindex="0" aria-label="{{ t('tasks.adv.mc_aria') }}">
                <i class="ti ti-info-circle"></i>
                <div class="scan-adv-info-card">
                    <div class="text-secondary" style="font-size:0.77rem;">{{ t('tasks.adv.mc_card') }}</div>
                </div>
            </span>
        </div>
        <div class="adv-help">{{ t('tasks.adv.mc_help') }}</div>
    </div>
    <div class="form-check form-switch m-0 p-0">
        <input class="form-check-input" type="checkbox" role="switch" name="multicast" value="1" id="{{ prefix }}_mc_input">
    </div>
</div>
